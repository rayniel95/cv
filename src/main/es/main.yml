        Licenciado en Ciencia de la Computación, con el título universitario homologado en España y experiencia en proyectos multidisciplinares y formación de estudiantes del ámbito social. He coordinado actividades, seguido y evaluado el progreso, elaborado documentación e informes y comunicado resultados. Aporto organización, comunicación clara y motivación por contribuir a programas de formación e inserción laboral.

    Competencias clave:
      - bullet: Elaboración de documentación técnica, procedimientos e informes de seguimiento de proyectos.
      - bullet: Planificación, coordinación, seguimiento y evaluación continua de actividades, tareas e incidencias.
      - bullet: Diseño e impartición de formación, materiales y exámenes; evaluación del progreso y detección de necesidades de apoyo.
      - bullet: "Coordinación y comunicación con equipos, responsables y entidades académicas; Jira, Scrum y reuniones de seguimiento."
      - bullet: "Ofimática y comunicación: Word, Excel, PowerPoint, SPSS, correo electrónico e Internet. Español nativo e inglés B2 (intermedio alto, 55/100), [certificado EF SET](https://cert.efset.org/es/835vDd)."

    Experiencia profesional:
      - company: Deep Kernel Labs
        position: Ingeniero de Software e Ingeniero de Datos
        location: Ourense, Galicia, España
        start_date: 2026-04
        end_date: 2026-06
        summary: >
          Proyecto Applus: plataforma de prueba de concepto para estandarizar procesos de inspección y trabajar con normativa regulatoria.
        highlights:
          - Participé en la definición, planificación y seguimiento de tareas mediante Jira y Scrum, comunicando avances e incidencias.
          - Documenté, validé y evalué funcionalidades mediante pruebas, y diseñé trazabilidad entre procedimientos y requisitos regulatorios.

      - company: Datamart
        position: Desarrollador backend y cloud
        location: La Habana, Cuba
