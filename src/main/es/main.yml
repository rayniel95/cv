      - bullet: Planificación, coordinación y seguimiento de actividades, tareas, hitos e incidencias.
      - bullet: Evaluación y control de calidad mediante pruebas, validación de resultados y revisión de datos.
      - bullet: "Coordinación y comunicación con clientes, equipos y responsables de proyecto; Jira, Scrum y seguimiento de incidencias."
      - bullet: "Ofimática y análisis: Word, Excel, PowerPoint, SPSS, EndNote, correo electrónico, Internet, SQL y Postman. Español nativo e inglés B2."

