        Licenciado en Ciencia de la Computación, con el título universitario homologado en España y más de tres años de experiencia trabajando con sistemas empresariales, procesos de datos e integraciones entre servicios. He desarrollado y mantenido plataformas SaaS, validado información mediante SQL, monitorizado flujos de trabajo, documentado sistemas y coordinado la resolución de incidencias. Mi experiencia con arquitecturas complejas y aplicaciones legacy me permite adaptarme rápidamente a nuevos sistemas informáticos de gestión.

    Competencias clave:
      - bullet: Sistemas empresariales, procesos de datos, integraciones entre servicios y trazabilidad de la información.
      - bullet: Validación de datos y procesos mediante SQL, PostgreSQL, Postman y pruebas automatizadas.
      - bullet: Monitorización de flujos de trabajo, detección de incidencias, análisis de riesgos y seguimiento de tareas.
      - bullet: "Documentación técnica y coordinación con equipos y responsables; Jira, Scrum, APIs REST y GraphQL."
      - bullet: "Ofimática y comunicación: Word, Excel, PowerPoint, correo electrónico e Internet. Español nativo e inglés B2 (intermedio alto, 55/100; certificado EF SET: [cert.efset.org/es/835vDd](https://cert.efset.org/es/835vDd))."

