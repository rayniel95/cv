        end_date: 2025-07
        summary: >
          Proyectos SaaS para clientes financieros y empresariales, desde el análisis de necesidades y la definición de flujos hasta la implementación, las pruebas y el seguimiento posterior.
        highlights:
          - Coordiné el trabajo diario con equipos de desarrollo, cloud, frontend, Scrum Masters, Product Owners y responsables técnicos.
          - Gestioné tareas e incidencias en Jira, informé del progreso y comuniqué riesgos y propuestas de mejora en reuniones de seguimiento.
          - Elaboré documentación y diagramas de sistemas, y validé funcionalidades, contratos de API y datos mediante Postman, SQL y pruebas automatizadas.

    Experiencia académica y voluntariado:
